# Ein Dock (Variante A): eigene Datenleitung und eigener DETECT-Eingang.
# Wird von individual.yaml je Dock mit vars eingebunden: n, din, det.
light:
  - platform: esp32_rmt_led_strip
    id: led_${n}
    name: "Gebäude ${n}"
    pin: ${din}
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    rmt_symbols: 64          # ein RMT-Block je Leitung, ESP32 hat 8 (512 Symbole)
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: steckt_${n}
    name: "Gebäude ${n} steckt"
    pin:
      number: ${det}
      mode:
        input: true
        pullup: true         # interner Pull-up, das Gebäude zieht DETECT auf GND
      inverted: true         # LOW = Gebäude steckt
    filters:
      - delayed_on: 100ms    # erst wenn alle Kontakte sicher sitzen
      - delayed_off: 50ms
    trigger_on_initial_state: true   # schon steckende Gebäude nach dem Start anschalten
    on_press:
      - script.execute: neon_${n}
    on_release:
      - script.stop: neon_${n}
      - light.turn_off:
          id: led_${n}
          transition_length: 0s

script:
  # Anlauf wie eine Leuchtstoffröhre: zweimal kurz zucken, dann weich hochdimmen.
  - id: neon_${n}
    mode: restart
    then:
      - light.turn_on:
          id: led_${n}
          brightness: 70%
          red: 100%
          green: 78%
          blue: 50%
          transition_length: 0s
      - delay: 50ms
      - light.turn_off:
          id: led_${n}
          transition_length: 0s
      - delay: 180ms
      - light.turn_on:
          id: led_${n}
          brightness: 35%
          red: 100%
          green: 78%
          blue: 50%
          transition_length: 0s
      - delay: 30ms
      - light.turn_off:
          id: led_${n}
          transition_length: 0s
      - delay: 400ms
      - light.turn_on:
          id: led_${n}
          brightness: 100%
          red: 100%
          green: 78%
          blue: 50%
          transition_length: 1500ms
