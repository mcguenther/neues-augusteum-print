<title>Planung Testfall Kassette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: je Entscheidung eine Karte, links Befund/Deutung/Entscheidung, rechts Vorher/Nachher-Zeichnungen; auf dem Handy untereinander.
   Farben wie die übrigen Steckmechanismus-Seiten; Rot nur für Fehlerbilder (Knick, Durchhang), Grün für Neues. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --fg: #1b2220; --muted: #5a6560; --line: #d6dbd6; --ink: rgba(27,34,32,.55); --field: #f7f8f6;
  --accent: #a85f00; --accent-fill: #f0a21a; --on-accent: #1b1300; --ok: #2f7d4f; --warn: #b5471f; --new: #2f7d4f;
  --f-plate: #c9d6e2; --f-bld: #e9e1c9; --f-kass: #f0b576; --f-key: #8ccf9a; --f-hsg: #f7f5ee; --f-led: #f3dc7a; --f-wire: #c8423b;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311; --panel: #171c1a; --fg: #e5eae7; --muted: #99a5a0; --line: #2c3431; --ink: rgba(229,234,231,.55); --field: #1d2321;
    --accent: #f2b441; --accent-fill: #f2b441; --ok: #5cc287; --warn: #ff8d62; --new: #5cc287;
    --f-plate: #2a3a4a; --f-bld: #4a4430; --f-kass: #8a521f; --f-key: #2f6a41; --f-hsg: #cfd3cb; --f-led: #b8a040; --f-wire: #ff7a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311; --panel: #171c1a; --fg: #e5eae7; --muted: #99a5a0; --line: #2c3431; --ink: rgba(229,234,231,.55); --field: #1d2321;
  --accent: #f2b441; --accent-fill: #f2b441; --ok: #5cc287; --warn: #ff8d62; --new: #5cc287;
  --f-plate: #2a3a4a; --f-bld: #4a4430; --f-kass: #8a521f; --f-key: #2f6a41; --f-hsg: #cfd3cb; --f-led: #b8a040; --f-wire: #ff7a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55;
  padding-block: 24px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.8rem, 4vw + 1rem, 2.6rem); font-weight: 700; } h2 { font-size: 1.25rem; font-weight: 650; }
p { margin: 0; max-width: 72ch; }
code { font-family: var(--mono); font-size: .86em; background: color-mix(in srgb, var(--line) 55%, transparent); padding: .05em .35em; border-radius: 3px; }
.kicker { font-family: var(--mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lead { color: var(--muted); }
.top { display: flex; flex-direction: column; gap: 10px; }
.sum { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 80ch; }

.dec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.dec > header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.dec .tg { font-family: var(--mono); font-weight: 600; background: var(--fg); color: var(--bg); padding: 3px 10px; border-radius: 999px; font-size: .85rem; white-space: nowrap; }
.dec h2 { flex: 1 1 260px; min-width: 0; }
.st { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1.5px solid var(--line); white-space: nowrap; }
.st-entscheidung, .st-regel { border-color: var(--ok); color: var(--ok); }
.st-empfehlung, .st-test, .st-ergaenzung { border-color: var(--accent); color: var(--accent); }
.st-rueckfrage { border-color: var(--warn); color: var(--warn); }
.cols { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: start; }
.txt { display: flex; flex-direction: column; gap: 10px; font-size: .95rem; min-width: 0; }
.dcs { border-left: 3px solid var(--new); padding-left: 12px; }
.dcs ul { margin: 6px 0 0; padding-left: 1.1em; display: grid; gap: 4px; }
.alt, .note { font-size: .9rem; color: var(--muted); }
.fin { font-size: .92rem; border-left: 3px solid var(--new); background: color-mix(in srgb, var(--new) 9%, transparent); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.ask { font-size: .92rem; border-left: 3px solid var(--warn); padding-left: 12px; }
.figs { display: grid; gap: 12px; min-width: 0; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.figbox { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; }
.figbox svg { display: block; width: 100%; max-width: 460px; height: auto; margin-inline: auto; }
.fig figcaption { font-size: .82rem; color: var(--muted); }
.ct { border-collapse: collapse; width: 100%; font-size: .86rem; }
.ct th, .ct td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ct th { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.vote { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.ok { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; color: var(--muted); min-width: 0; }
select, input[type=text], textarea { font: inherit; font-size: .95rem; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.plan { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.plan table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.plan td, .plan th { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.plan th { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { white-space: nowrap; text-align: right; font-family: var(--mono); }
.out { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.out textarea { font-family: var(--mono); font-size: .82rem; min-height: 220px; resize: vertical; }
.btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btns button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: 0; cursor: pointer; background: var(--accent-fill); color: var(--on-accent); }
.btns .msg { font-size: .88rem; color: var(--ok); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Zeichnungen */
.dsvg text, svg text { font-family: var(--font); fill: var(--fg); }
svg .lbl { font-size: 11px; } svg .lblb { font-size: 12px; font-weight: 650; } svg .lbls { font-size: 10px; fill: var(--muted); }
svg .lblw { font-size: 11px; font-weight: 600; fill: var(--warn); } svg .lbln { font-size: 11px; font-weight: 600; fill: var(--new); }
svg .tick { font: 10px var(--mono); fill: var(--muted); } svg .grid { stroke: var(--line); }
svg .zone { fill: color-mix(in srgb, var(--warn) 12%, transparent); }
svg .mark { stroke: var(--fg); stroke-dasharray: 3 3; }
svg .bar-old { fill: color-mix(in srgb, var(--muted) 45%, var(--panel)); } svg .bar-new { fill: var(--new); }
svg rect, svg polygon { stroke: var(--ink); stroke-width: .8; }
svg .p-slab { fill: var(--f-plate); } svg .p-key { fill: var(--f-key); } svg .p-kass { fill: var(--f-kass); } svg .p-bld { fill: var(--f-bld); }
svg .p-hsg { fill: var(--f-hsg); fill-opacity: .9; } svg .p-led { fill: var(--f-led); } svg .p-void { fill: var(--field); stroke: none; }
svg .p-void2 { fill: var(--field); } svg .p-body { fill: var(--fg); } svg .p-pin { fill: var(--fg); stroke: none; }
svg .p-rib { fill: var(--warn); stroke: none; }
svg .sag { fill: none; stroke: var(--warn); stroke-width: 2; } svg .thread { fill: none; stroke: var(--warn); stroke-width: 1.2; }
svg .wire { fill: none; stroke: var(--f-wire); stroke-width: 3.2; stroke-linejoin: miter; stroke-linecap: round; }
svg .arrow { fill: none; stroke: var(--new); stroke-width: 2; }
svg .dim { stroke: var(--fg); } svg .dimn { stroke: var(--new); stroke-width: 1.4; }
svg .blk { fill: #1d1f1f; } svg .engr { font: 700 30px var(--font); fill: #262828; stroke: #303333; stroke-width: .6; }
svg .rais { font: 700 30px var(--font); fill: #3a3d3d; stroke: #8c9191; stroke-width: 1.2; } svg .notch { fill: var(--panel); stroke: none; }
svg .cham { fill: var(--new); stroke: none; }
@media (max-width: 780px) { .cols { grid-template-columns: minmax(0, 1fr); } .vote { grid-template-columns: minmax(0, 1fr); } }

/* Plan: Zeichnungen mit Regler, Tabellen, Listen */
.wide { max-width: 1080px; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec > h2 { font-size: 1.25rem; }
.sec h3 { font-size: 1rem; font-weight: 650; margin-top: 4px; }
.sec ul.q { margin: 0; padding-left: 1.2em; display: grid; gap: 5px; max-width: 80ch; }
.tw { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.t th, table.t td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
table.t td.n { white-space: nowrap; font-family: var(--mono); font-size: .84rem; }
table.t td b { font-weight: 650; }
.two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.figbox { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; }
.figbox svg { display: block; width: 100%; height: auto; margin-inline: auto; }
.figbox.s560 svg { max-width: 560px; } .figbox.s700 svg { max-width: 700px; } .figbox.s460 svg { max-width: 460px; }
.fig img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.fig figcaption { font-size: .85rem; color: var(--muted); }
.dgctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.dgctl label { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.dgctl input[type=range] { width: min(260px, 60vw); accent-color: var(--accent); }
.dgctl .play { font: inherit; font-size: .88rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.dgctl .play:hover { background: var(--accent-fill); color: var(--on-accent); }
.note { font-size: .9rem; color: var(--muted); max-width: 80ch; }
.risk { border-left: 3px solid var(--warn); padding-left: 12px; font-size: .92rem; max-width: 80ch; }
.risk b { color: var(--warn); }
.dec .rec { font-size: .78rem; font-family: var(--mono); color: var(--ok); }
.opts { display: grid; gap: 6px; font-size: .92rem; }
.opts div { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 4px 8px; }
.opts b { font-family: var(--mono); }
svg .d-slab { fill: var(--f-plate); } svg .d-lid { fill: color-mix(in srgb, var(--f-key) 70%, var(--f-plate)); }
svg .d-bld { fill: var(--f-bld); } svg .d-kass { fill: var(--f-kass); } svg .d-hsg { fill: var(--f-hsg); fill-opacity: .92; }
svg .d-led { fill: var(--f-led); } svg .d-term { fill: #d9b24a; stroke: none; } svg .d-void { fill: var(--field); stroke: none; }
svg .d-body { fill: var(--fg); } svg .d-pin { fill: var(--fg); stroke: none; }
svg .d-wire { fill: none; stroke: var(--f-wire); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
svg .d-open { fill: color-mix(in srgb, var(--new) 14%, var(--field)); stroke: var(--new); stroke-dasharray: 4 3; }
svg .d-dash { fill: none; stroke: var(--ink); stroke-dasharray: 4 3; stroke-width: .9; }
svg .d-screw { fill: var(--field); stroke: var(--ink); }
svg .dl { font-size: 11px; } svg .dlb { font-size: 12px; font-weight: 650; } svg .dls { font-size: 10px; fill: var(--muted); } svg .dln { font-size: 11px; font-weight: 600; fill: var(--new); }
svg .dlw { font-size: 11px; font-weight: 600; fill: var(--warn); }
svg .dim { stroke: var(--fg); stroke-width: 1; } svg .dimn { stroke: var(--new); stroke-width: 1.4; }
svg .bar-ok { fill: var(--new); } svg .bar-bad { fill: color-mix(in srgb, var(--warn) 70%, var(--panel)); }
svg .bar-old { fill: color-mix(in srgb, var(--muted) 45%, var(--panel)); } svg .bar-new { fill: var(--accent-fill); stroke: var(--accent); }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<div class="wrap">
{{HEAD}}
{{SECTIONS}}
<section class="out" id="antwort">
  <h2>Antwort zum Kopieren</h2>
  <textarea id="out" readonly aria-label="Antwort zum Kopieren"></textarea>
  <div class="btns"><button type="button" id="copy">Text kopieren</button><span class="msg" id="msg" role="status"></span></div>
</section>
</div>

<script>
(function () {
  var SPEC = {{SPEC}}, KEY = 'testfall-plan-v1', st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { st = {}; }
  function applyMove(fig, forId, v) {
    var g = fig.querySelector('#' + forId);
    if (!g) return;
    var m = g.getAttribute('data-move').split(',').map(Number);
    g.setAttribute('transform', 'translate(' + (m[0] + (m[2] - m[0]) * v).toFixed(1) + ',' + (m[1] + (m[3] - m[1]) * v).toFixed(1) + ')');
  }
  Array.prototype.forEach.call(document.querySelectorAll('figure.mv'), function (fig) {
    var r = fig.querySelector('input.dgr'), play = fig.querySelector('.play');
    r.addEventListener('input', function () { applyMove(fig, r.getAttribute('data-for'), r.value / 100); });
    play.addEventListener('click', function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { r.value = 100; applyMove(fig, r.getAttribute('data-for'), 1); return; }
      r.value = 0; applyMove(fig, r.getAttribute('data-for'), 0);
      var t0 = null;
      function frame(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(1, (t - t0) / 1800), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        r.value = Math.round(e * 100); applyMove(fig, r.getAttribute('data-for'), e);
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  });
  function build() {
    var out = ['PLANUNG TESTFALL KASSETTE · ANTWORT'];
    SPEC.forEach(function (d) {
      var s = document.getElementById('a-' + d.id), n = document.getElementById('n-' + d.id).value.trim();
      var v = s.value, lab = v ? s.options[s.selectedIndex].text : '';
      if (!v && !n) return;
      out.push('- [' + d.tag + '] ' + d.title + ': ' + (lab || 'ohne Wahl') + (n ? ' · ' + n : ''));
    });
    if (out.length === 1) out.push('(noch nichts ausgewählt)');
    document.getElementById('out').value = out.join('\n');
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-did],[data-nid]'), function (e) {
    if (st[e.id] !== undefined) e.value = st[e.id];
    var h = function () { st[e.id] = e.value; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (x) {} build(); };
    e.addEventListener('input', h); e.addEventListener('change', h);
  });
  build();
  var msg = document.getElementById('msg');
  document.getElementById('copy').addEventListener('click', function () {
    var ta = document.getElementById('out');
    function fb() { ta.focus(); ta.select(); msg.textContent = 'Markiert, mit Strg+C bzw. Cmd+C kopieren.'; }
    try { navigator.clipboard.writeText(ta.value).then(function () { msg.textContent = 'Kopiert.'; }, fb); } catch (e) { fb(); }
  });
})();
</script>
